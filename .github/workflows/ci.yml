name: FloodGuard verification

on:
  push:
    branches: [master, "codex/**", "system-fix"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: floodguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and schema contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync root environment without GeoAI
        run: uv sync --locked --all-extras
      - name: Run root tests
        run: uv run pytest --junitxml=.tmp/proposal-evidence/root.xml
      - name: Upload core test receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-junit
          path: .tmp/proposal-evidence/root.xml
          if-no-files-found: error
          retention-days: 14

  api:
    name: FastAPI contract boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync API environment
        run: uv sync --project services/api --locked --group dev
      - name: Lint API
        run: uv run --project services/api ruff check services/api/src services/api/tests
      - name: Run API tests
        run: >-
          uv run --project services/api pytest services/api/tests
          --junitxml=.tmp/proposal-evidence/api.xml
      - name: Upload API test receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-junit
          path: .tmp/proposal-evidence/api.xml
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Static PWA and offline judging mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install offline browser runtime
        run: pnpm --filter @floodguard/web exec playwright install --with-deps chromium
      - name: Verify contracts, web, build, and offline mode
        run: >-
          python scripts/run_check_with_junit.py
          --suite frontend
          --output .tmp/proposal-evidence/frontend.xml
          -- pnpm verify:frontend
      - name: Upload frontend verification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-junit
          path: .tmp/proposal-evidence/frontend.xml
          if-no-files-found: error
          retention-days: 14

  geoai-normal:
    name: Isolated GeoAI runner (dependency-light)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync runner without the GeoAI extra
        run: uv sync --project services/geoai-runner --locked --group test
      - name: Confirm normal environment excludes GeoAI and PyTorch
        run: >-
          uv run --project services/geoai-runner python -c
          "import importlib.util;
          assert importlib.util.find_spec('geoai') is None;
          assert importlib.util.find_spec('torch') is None"
      - name: Lint isolated runner
        run: >-
          uv run --project services/geoai-runner ruff check
          services/geoai-runner/geoai_runner services/geoai-runner/tests
      - name: Run dependency-light runner tests
        run: >-
          uv run --project services/geoai-runner pytest
          services/geoai-runner/tests -m "not geoai_smoke"
          --junitxml=.tmp/proposal-evidence/geoai-normal.xml
      - name: Upload runner test receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geoai-normal-junit
          path: .tmp/proposal-evidence/geoai-normal.xml
          if-no-files-found: error
          retention-days: 14

  extras-resolve:
    name: Declared extras must resolve
    runs-on: ubuntu-latest
    # An extra that cannot install is a false capability claim: it advertises a
    # component nobody can run. This exact failure took the runner job down for
    # five days without anyone noticing, because the job died at `uv sync`
    # before reaching its tests (D-39 / D-10). Resolution is cheap; check it
    # separately so the signal is unambiguous.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Resolve every declared runner extra
        run: >-
          uv sync --project services/geoai-runner --extra geoai
          --extra realpipeline --extra sam --dry-run
      - name: Research extra must resolve in its own environment
        # omniwatermask needs numpy<2.4 and cannot share the runner's frozen
        # numpy==2.4.2, which is why it is a separate requirements file.
        # Writes to a real temp path: uv stages the output through a sibling
        # temp file, so /dev/null is not a usable target.
        run: >-
          uv pip compile services/geoai-runner/requirements-research.txt
          --python-version 3.12 --quiet
          --output-file "${RUNNER_TEMP}/research-resolution.txt"

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    # Advisory: reports known CVEs without blocking the build. The project had
    # no vulnerability scanning at all (D-23), so the first priority is
    # visibility. Promote to blocking once the baseline is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Audit root Python dependencies
        run: uv run --with pip-audit pip-audit --strict || true
      - name: Audit API dependencies
        run: >-
          uv run --project services/api --with pip-audit pip-audit --strict || true
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level moderate || true
