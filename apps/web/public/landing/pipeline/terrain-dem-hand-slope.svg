<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="Cross-section showing HAND measured as vertical height above the nearest drainage channel, low for the valley floor and high for the hillside"><style>text{font-family:"Manrope Variable",system-ui,sans-serif;fill:#3D4E57}.lbl{font-size:12px}.sml{font-size:10.5px;fill:#64767E}.mono-t{font-family:ui-monospace,"IBM Plex Mono",monospace;font-size:11px}.hi{fill:#0C6A74}.warnt{fill:#8A4A44}</style>
            <line x1="40" y1="175" x2="610" y2="175" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 3"/>
            <path d="M40 90 L120 110 L190 140 L250 165 L290 172 L310 174 L330 172 L370 160 L430 120 L500 78 L560 60 L610 52"
                  fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="286" y="168" width="48" height="8" fill="#0C6A74" opacity="0.55"/>
            <text class="sml hi" x="310" y="193" text-anchor="middle">river channel</text>

            <line x1="250" y1="165" x2="250" y2="175" stroke="#0C6A74" stroke-width="2"/>
            <circle cx="250" cy="165" r="3.5" fill="#0C6A74"/>
            <text class="sml hi" x="196" y="158">HAND ≈ 2 m</text>
            <text class="sml" x="196" y="145">floods first</text>

            <line x1="500" y1="78" x2="500" y2="175" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="500" cy="78" r="3.5" fill="currentColor"/>
            <text class="sml" x="512" y="112">HAND ≈ 20 m</text>
            <text class="sml" x="512" y="126">stays dry</text>

            <text class="lbl" x="40" y="28">Height Above Nearest Drainage — vertical distance to the channel it drains into</text>
            <text class="sml" x="40" y="46">Not elevation above sea level. Two points at the same altitude can have very different HAND.</text>
          </svg>