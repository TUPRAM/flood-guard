[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodguard-thailand"
version = "0.1.0"
description = "GeoAI decision-support prototype for flood preparedness priority scoring in Thailand."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "FloodGuard Thailand" }
]
dependencies = [
  "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.23"
]
ml = [
  "scikit-learn>=1.4"
]
geo = [
  "geopandas>=0.14",
  "pyproj>=3.6",
  "shapely>=2.1.2",
  "networkx>=3.0"
]
theos2 = [
  "rasterio>=1.4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
floodguard = ["static/leaflet/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
