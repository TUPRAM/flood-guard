[project]
name = "floodguard-geoai-runner"
version = "0.1.0"
description = "Isolated, fail-closed GeoAI adapter for FloodGuard Thailand"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.25.1",
  "numpy==2.4.2",
  "rasterio==1.4.4",
]

[project.optional-dependencies]
geoai = [
  "geoai-py==0.41.1",
  "segmentation-models-pytorch==0.5.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
]
# The executable real-data pipeline (realpipeline/) fetches real Sentinel-1/2,
# Copernicus DEM, JRC water, Thai NGIS layers and OSM buildings, then runs the
# GeoAI components end to end. It needs these beyond the frozen geoai extra.
realpipeline = [
  "geoai-py==0.41.1",
  "segmentation-models-pytorch==0.5.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
]

[dependency-groups]
test = [
  "floodguard-thailand",
  "pytest==9.0.2",
  "ruff==0.12.4",
]

[tool.uv.sources]
floodguard-thailand = { path = "../..", editable = true }

[project.scripts]
floodguard-geoai = "geoai_runner.cli:main"
floodguard-geoai-real = "geoai_runner.realpipeline.run_real:main"

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geoai_runner"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "geoai_smoke: requires the isolated GeoAI extra and RUN_GEOAI_SMOKE=1",
]
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = [
  "aiohttp>=3.13.4",
  "cryptography>=46.0.6",
  "requests>=2.33.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
